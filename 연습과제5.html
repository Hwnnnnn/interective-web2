<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>연습과제5</title>
    <style>
        body { margin: 0; background-color: #111; overflow: hidden; }
        .box {
            position: absolute;
            border-radius: 50%;
            opacity: 0.7;
            mix-blend-mode: screen;
        }
    </style>
</head>
<body>
<script>
let texts = "";


let centerX = 50; 
let centerY = 50; 

for (let i = 0; i < 50; i++) {
    let offset = i * 0.6;
    let size = 60 - i; 
    let deg = i * 3.2;

   
    let r = Math.floor(200 + 55 * Math.sin(i * 0.3));
    let g = Math.floor(200 + 55 * Math.sin(i * 0.5));
    let b = Math.floor(200 + 55 * Math.sin(i * 0.7));

   
    let x = centerX - size / 2 + offset;
    let y = centerY - size / 2 + offset;

    texts += `<div class='box'
            style='left:${x}vw; top:${y}vh;
            width:${size}vw; height:${size}vh;
            background-color:rgba(${r},${g},${b},0.3);
            transform:rotate(${deg}deg);'></div>`;
}

document.write(texts);


let mousex = 0;
document.addEventListener("mousemove", (e) => {
    mousex = e.clientX;
});

function changeAngle() {
    let boxes = document.querySelectorAll(".box");
    boxes.forEach((box, i) => {
        let deg = i * (mousex * 0.015);
        box.style.transform = `rotate(${deg}deg)`;
    });
}

setInterval(changeAngle, 30);
</script>
</body>
</html>
